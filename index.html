<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07080b">
<title>PinPoint — Live Location Safety Network</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:#07080b;color:#e9ecf3;min-height:100vh;padding:26px 18px 70px;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body:before{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(900px 520px at 50% -12%,rgba(255,59,92,.18),transparent 70%),
      radial-gradient(700px 420px at 92% 8%,rgba(77,163,255,.10),transparent 70%);
  }
  .wrap{max-width:520px;margin:0 auto}
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:26px}
  .logo{
    width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
    font-weight:800;color:#fff;background:linear-gradient(145deg,#ff3b5c,#a4122f);
    box-shadow:0 6px 18px rgba(255,59,92,.35);
  }
  .brand{font-weight:700;letter-spacing:-.02em;font-size:16px}
  .brand span{color:#ff3b5c}
  .pill{
    margin-left:auto;display:flex;align-items:center;gap:6px;font:600 10px/1 ui-monospace,monospace;
    letter-spacing:.12em;padding:6px 9px;border:1px solid #262c38;border-radius:99px;color:#9aa3b3;
  }
  .pill i{width:6px;height:6px;border-radius:99px;background:#ff3b5c;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(255,59,92,.6)}50%{opacity:.55;box-shadow:0 0 0 5px rgba(255,59,92,0)}}
  h1{font-size:29px;line-height:1.16;letter-spacing:-.03em;margin:0 0 12px}
  h1 em{font-style:italic;color:#ff5c78}
  .sub{color:#8b93a3;font-size:13.5px;line-height:1.55;margin:0 0 18px}
  .trust{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
  .tchip{
    display:flex;align-items:center;gap:6px;font-size:10.5px;color:#8b93a3;
    border:1px solid #1c212b;border-radius:99px;padding:5px 9px;background:#0b0e13;
  }
  .tchip b{color:#cfd5e0}
  .tchip .dot{width:5px;height:5px;border-radius:99px;background:#2ee6a8}
  .card{background:#0d1016;border:1px solid #1c212b;border-radius:18px;padding:16px}
  .statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .stat{text-align:center;padding:8px 4px;border-right:1px solid #171b23}
  .stat:last-child{border-right:0}
  .stat b{display:block;font:600 17px/1.2 ui-monospace,monospace;color:#e9ecf3}
  .stat small{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#6b7383}
  .btn{
    width:100%;padding:13px;border-radius:12px;border:1px solid transparent;
    font:600 13.5px/1 ui-sans-serif,system-ui;cursor:pointer;transition:.15s;
  }
  .btn:disabled{opacity:.6;cursor:progress}
  .btn-primary{background:#161a22;border-color:#262c38;color:#dfe4ee;margin-bottom:8px}
  .btn-primary:hover{background:#1c212b}
  .btn-alert{
    background:linear-gradient(145deg,#ff3b5c,#bd1b38);color:#fff;letter-spacing:.06em;
    box-shadow:0 10px 26px rgba(255,59,92,.28);
  }
  .btn-alert:hover{filter:brightness(1.08)}
  .status{
    display:flex;align-items:center;gap:8px;font:11px/1.4 ui-monospace,monospace;
    color:#8b93a3;margin:14px 0 12px;padding-top:12px;border-top:1px solid #171b23;
  }
  .status .dot{width:6px;height:6px;border-radius:99px;background:#ff3b5c;flex:none}
  .status.ok .dot{background:#2ee6a8;animation:pulse 1.4s infinite}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
  .cell{background:#10141b;border:1px solid #1c212b;border-radius:10px;padding:8px 9px;overflow:hidden}
  .cell small{display:block;font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;color:#6b7383;margin-bottom:3px}
  .cell span{font:12px/1.35 ui-monospace,monospace;color:#cfd5e0;word-break:break-word}
  .map{display:none;margin-bottom:10px;border-radius:12px;overflow:hidden;border:1px solid #1c212b}
  .map iframe{display:block;width:100%;height:170px;border:0;filter:grayscale(.25) contrast(1.05)}
  .log{
    font:11px/1.5 ui-monospace,monospace;color:#7b8494;background:#0a0d12;
    border:1px solid #171b23;border-radius:10px;padding:8px 9px;max-height:132px;overflow:auto;
  }
  .log .ok{color:#2ee6a8}
  .log .err{color:#ff5c78}
  .depts{margin-top:26px}
  .depts h3{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:#6b7383;font-weight:600;margin:0 0 10px}
  .deptlist{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .dept{
    font-size:11px;color:#8b93a3;background:#0b0e13;border:1px solid #171b23;
    border-radius:8px;padding:8px;display:flex;align-items:center;gap:6px;
  }
  .dept:before{content:"";width:5px;height:5px;border-radius:99px;background:#2ee6a8;flex:none}
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,24px);opacity:0;
    background:#10141b;border:1px solid #262c38;border-radius:12px;padding:11px 16px;
    font:600 12px/1 ui-sans-serif,system-ui;color:#e9ecf3;pointer-events:none;transition:.25s;
    box-shadow:0 12px 30px rgba(0,0,0,.5);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="logo">P</div>
    <div class="brand">Pin<span>Point</span></div
